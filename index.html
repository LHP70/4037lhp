<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>江西师范大学</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Microsoft YaHei", sans-serif;
            background-color: #f4f6f9;
            color: #333;
        }
        .header {
            background-color: #004b87;
            color: white;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
        }
        .header a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 16px;
        }
        .hero {
            background: linear-gradient(to right, #004b87, #0073b1);
            color: white;
            text-align: center;
            padding: 80px 20px;
        }
        .hero h2 {
            font-size: 40px;
            margin-bottom: 10px;
        }
        .hero p {
            font-size: 20px;
            letter-spacing: 5px;
        }
        .motto {
            text-align: center;
            padding: 50px 20px;
            background-color: white;
        }
        .motto h2 {
            color: #004b87;
        }
        .motto-text {
            font-size: 30px;
            font-weight: bold;
            color: #d32f2f;
            margin-top: 20px;
        }
        .cards {
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 50px 20px;
            max-width: 1000px;
            margin: 0 auto;
            flex-wrap: wrap;
        }
        .card {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            flex: 1;
            min-width: 250px;
            border-top: 5px solid #004b87;
        }
        .card h3 {
            color: #004b87;
            margin-top: 0;
        }
        .footer {
            background-color: #002b4d;
            color: #a0b2c6;
            text-align: center;
            padding: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>江西师范大学</h1>
        <div>
            <a href=" ">首页</a >
            <a href="#">学校概况</a >
            <a href="#">院系设置</a >
            <a href="#">招生就业</a >
        </div>
    </div>

    <div class="hero">
        <h2>静思笃行 持中秉正</h2>
        <p>Jiangxi Normal University</p >
    </div>

    <div class="motto">
        <h2>欢迎来到江西师范大学</h2>
        <div class="motto-text">大美师大，期待与你相遇</div>
    </div>

    <div class="cards">
        <div class="card">
            <h3>历史底蕴</h3>
            <p>学校肇始于1940年创建的国立中正大学，历史悠久，文化底蕴深厚。</p >
        </div>
        <div class="card">
            <h3>校园风光</h3>
            <p>瑶湖校区依水而建，环境优美，是读书治学的理想园地。</p >
        </div>
        <div class="card">
            <h3>师资力量</h3>
            <p>学校拥有一支结构合理、素质优良的师资队伍，名师荟萃。</p >
        </div>
    </div>

    <div class="footer">
        <p>© 2026 江西师范大学 版权所有 | 地址：江西省南昌市紫阳大道99号</p >
    </div>

</body>
</html>
